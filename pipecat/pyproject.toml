[project]
name = "higgs-pipecat-tutorial"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[runner,webrtc]==1.12.0",
    "pipecat-boson",
    "python-dotenv",
    "aiohttp",
]

[tool.uv]
package = false

[tool.uv.sources]
# boson-ai/pipecat-boson#10 (the playground shows the bot's replies) and #11
# (typed text gets a reply), combined. Switch to the PyPI release
# (pipecat-boson>=0.1.4) once both are published.
pipecat-boson = { git = "https://github.com/YHPeter/pipecat-boson", rev = "b5eddafddbe77599f68298ebbd549ada62c6614f" }

[tool.ruff]
line-length = 119
